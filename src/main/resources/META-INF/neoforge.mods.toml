modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL = "https://github.com/Bexlax/Orevolution-neoforge/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL = "https://www.curseforge.com/minecraft/mc-mods/orevolution"
logoFile="logo.png"
logoBlur=false
itemIcon="orevolution:raw_tin"
authors="BexLa"
description='''
Orevolution expands Minecraft's main progression with four new ores, two (optional) new alloys, and unique abilities for both new and vanilla materials.

Currently adds: Tin, Platinum, Tungsten, Cassiterite, Moonstone, Aethersteel, Steel, Bronze, Livingstone and Verdite
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="blueprint"
    type="required"
    versionRange="[8.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="spears"
    type="optional"
    versionRange="[1.6.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="oreganized"
    type="optional"
    versionRange="[5.3.0,)"
    ordering="AFTER"
    side="BOTH"